name: FurryBox Auto Checkin

on:
  schedule:
    # 每天北京时间 11:07 执行 (UTC 03:07)，签到每天北京时间 0 点重置
    # 故意不用整点 / 半点：GitHub 定时在整点前后最挤，任务可能被延迟甚至直接丢掉，不报错也不留记录
    # 2026-11-20 从 09:07 改到 11:07：UTC 00:00-02:00 是全球定时最挤的时段，09:07 的任务连着两天拖到下午四点半才跑
    - cron: '24 3 * * *'
  workflow_dispatch: # 支持手动测试触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkin Script
        env:
          # 密码版(推荐): 每天现登现签，密码不会轮换作废
          FURRYBOX_EMAIL: ${{ secrets.FURRYBOX_EMAIL }}
          FURRYBOX_PASSWORD: ${{ secrets.FURRYBOX_PASSWORD }}
          FURRYBOX_EMAIL_2: ${{ secrets.FURRYBOX_EMAIL_2 }}
          FURRYBOX_PASSWORD_2: ${{ secrets.FURRYBOX_PASSWORD_2 }}
          # 旧的 refresh_token 方式(回退用，会轮换作废，不推荐)
          FURRYBOX_REFRESH_TOKEN: ${{ secrets.FURRYBOX_REFRESH_TOKEN }}
          FURRYBOX_REFRESH_TOKEN_2: ${{ secrets.FURRYBOX_REFRESH_TOKEN_2 }}
        # checkin.py 放在 DigitalPlat-renew-djkyc 仓库的 FurryBox/ 文件夹里，
        # 不在仓库根目录，所以这里要带上 FurryBox/ 路径
        # 脚本本身不发通知，只把结果行写到 FurryBox/checkin_result.txt
        run: python3 FurryBox/checkin.py

      # 消息样式都在这一步里，不在脚本里。
      # 脚本只给结果行，这里拼表头、链接再发 Telegram。
      # 签到成功 / 已签过 / 失败都是同一条通知，表头只出现一次。
      - name: Send Telegram Notification
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 - << 'PY'
          import json, os, urllib.request

          token = os.getenv("TG_BOT_TOKEN")
          chat_id = os.getenv("TG_CHAT_ID")
          if not token or not chat_id:
              print("未设置 TG_BOT_TOKEN / TG_CHAT_ID，跳过通知")
              raise SystemExit(0)

          # 结果行：脚本写的 FurryBox/checkin_result.txt，每行一个账号
          try:
              with open("FurryBox/checkin_result.txt", encoding="utf-8") as f:
                  lines = [l.rstrip("\n") for l in f if l.strip()]
          except FileNotFoundError:
              lines = ["❌ 脚本没有产出结果文件，请看 Actions 日志"]
          if not lines:
              lines = ["❌ 脚本没有产出结果，请看 Actions 日志"]

          # 表头：用户名和项目名从 GITHUB_REPOSITORY 自动取
          # 例如 djbadboy-56959566-qq-com/DigitalPlat-renew-djkyc
          repo = os.getenv("GITHUB_REPOSITORY", "djbadboy-56959566-qq-com/DigitalPlat-renew-djkyc")
          owner, _, name = repo.partition("/")
          header = f"👤 {owner} · 📁 {name}"
          text = "\n".join([
              header,
              '🌐 签到的平台：<a href="https://my.furry.box/">请点击</a>',
              f'🔗 仓库：<a href="https://github.com/{repo}/">请点击</a>',
              *lines,
          ])

          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=json.dumps({"chat_id": chat_id, "text": text, "parse_mode": "HTML"}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          urllib.request.urlopen(req, timeout=15)
          print("Telegram 通知已发送")
          PY
